services:

  # Backend service
  backend:
    build: ./bams-backend
    container_name: bams-backend
    env_file:
      - ./bams-backend/.env
    ports:
      - "8000:7788"

  # Frontend Service
  frontend:
    build: 
      context: ./bams-frontend
    container_name: bams-frontend
    env_file:
      - ./bams-frontend/.env
    ports:
      - "5173:7777"
    depends_on:
      - backend

  